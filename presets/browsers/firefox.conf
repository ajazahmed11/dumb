# ==============================================================================
# DUMB Browser Preset: Mozilla Firefox
# Preserves active sessions, tokens, and cookies while pruning heavy disk cache.
# ==============================================================================

BROWSER_NAME="Mozilla Firefox"

# Candidate profile search directories
BROWSER_PATHS=(
    "$HOME/.config/mozilla/firefox"
    "$HOME/.mozilla/firefox"
)

# Exclusions to strip disposable web cache
BROWSER_EXCLUDES=(
    "**/cache2/**"
    "**/jumpListCache/**"
    "**/Crash Reports/**"
    "**/Pending Pings/**"
    "**/datareporting/**"
    "**/saved-telemetry-pings/**"
)
