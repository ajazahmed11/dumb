# ==============================================================================
# DUMB Browser Preset: Brave Browser
# Preserves active sessions, logins, and wallet state without cache bloat.
# ==============================================================================

BROWSER_NAME="Brave Browser"

BROWSER_PATHS=(
    "$HOME/.config/BraveSoftware/Brave-Browser"
)

BROWSER_EXCLUDES=(
    "*Cache*/**"
    "*cache*/**"
    "*GPUCache*/**"
    "*Code Cache*/**"
    "*CacheStorage*/**"
    "*blob_storage*/**"
    "*Crashpad*/**"
    "*Safe Browsing*/**"
    "*.lock"
    "*.sock"
)
