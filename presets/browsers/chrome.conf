# ==============================================================================
# DUMB Browser Preset: Google Chrome / Chromium
# Preserves user profiles, extensions, and session logins without cache bloat.
# ==============================================================================

BROWSER_NAME="Google Chrome / Chromium"

BROWSER_PATHS=(
    "$HOME/.config/google-chrome"
    "$HOME/.config/chromium"
)

BROWSER_EXCLUDES=(
    "*Cache*/**"
    "*cache*/**"
    "*GPUCache*/**"
    "*Code Cache*/**"
    "*CacheStorage*/**"
    "*blob_storage*/**"
    "*Crashpad*/**"
    "*Safe Browsing*/**"
    "*.lock"
    "*.sock"
)
