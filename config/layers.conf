# ==============================================================================
# DUMB — Default Layer Configuration & Exclusion Presets
# ==============================================================================

# Target remote or path (e.g. gdrive:DUMB-Vault, onedrive:Backup, /mnt/usb/Backup)
DUMB_REMOTE="${DUMB_REMOTE:-gdrive:Ajaz-Backup-Hub}"

# Layer 1: Personal Files exclusions
EXCLUDE_PERSONAL=(
    ".git/**"
    "node_modules/**"
    ".venv/**"
    "venv/**"
    "__pycache__/**"
    "target/**"
    "build/**"
    "*.iso"
)

# Layer 2: dot-config exclusions (strips disposable caches and runtime state)
EXCLUDE_CONFIG=(
    "*Cache*/**"
    "*cache*/**"
    "*GPUCache*/**"
    "*Code Cache*/**"
    "*CacheStorage*/**"
    "*blob_storage*/**"
    "mozilla/**"
    "*.lock"
    "*.sock"
    "dconf/user"
)

# Layer 3: Firefox Browser Session Vault exclusions (keeps cookies & logins)
EXCLUDE_FIREFOX=(
    "**/cache2/**"
    "**/jumpListCache/**"
    "**/Crash Reports/**"
    "**/Pending Pings/**"
)

# Layer 4: Dotfiles and Binaries exclusions
EXCLUDE_BINARIES=(
    "agy"
    "rclone"
)

# Layer 5: AI Agent Vault exclusions
EXCLUDE_AI_AGENTS=(
    "*.log"
    "antigravity-oauth-token"
    ".credentials.json"
    "cache/**"
    "daemon/**"
    "downloads/**"
)
