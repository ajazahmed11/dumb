# ==============================================================================
# DUMB — Workstation Configuration & Declarative Layer Definitions
# ==============================================================================

# Target storage destination (External SSD/USB, Local Sync Folder, Cloud, or SSH)
# Leave empty to select interactively via "Select & Go", or define your preference:
# Examples:
#   DUMB_REMOTE="/run/media/$USER/PENDRIVE/DUMB-Vault"  # USB Drive / External SSD
#   DUMB_REMOTE="$HOME/Nextcloud/DUMB-Vault"           # Local sync folder / Nextcloud
#   DUMB_REMOTE="gdrive:DUMB-Vault"                   # Google Drive via rclone
#   DUMB_REMOTE="user@server:/backups/DUMB-Vault"     # Remote server via SSH rsync
DUMB_REMOTE="${DUMB_REMOTE:-}"

# Active Presets
DUMB_BROWSER_PRESET="${DUMB_BROWSER_PRESET:-firefox}"
DUMB_HARDWARE_PRESET="${DUMB_HARDWARE_PRESET:-asus-rog}"

# ------------------------------------------------------------------------------
# Master Layer Registry (The 6 Workstation Layers)
# Format: "ID|Name|Description"
# ------------------------------------------------------------------------------
AVAILABLE_LAYERS=(
    "1|Personal Files|Documents, Projects, Pictures, etc."
    "2|Application Configurations|Clean ~/.config (excluding cache bloat)"
    "3|Browser Session Vault|Persistent logins and session cookies"
    "4|Home Dotfiles & Scripts|Tracked dotfiles and ~/.local/bin scripts"
    "5|AI Agent Vault|All configured AI agent memories and brain contexts"
    "6|Hardware Blueprint & Fonts|Fan curves, system services, and fonts"
)

# ------------------------------------------------------------------------------
# Layer 1: Personal Files
# Anyone can add or remove folders here simply by listing them!
# ------------------------------------------------------------------------------
PERSONAL_DIRS=(
    "$HOME/Documents"
    "$HOME/Pictures"
    "$HOME/Projects"
)

# Extra personal directories you can add (or via 'dumb add 1 <path>'):
EXTRA_PERSONAL_DIRS=(
    # "$HOME/Music"
    # "$HOME/Videos"
    # "$HOME/Notes"
    # "$HOME/Books"
)

EXCLUDE_PERSONAL=(
    ".git/**"
    "node_modules/**"
    ".venv/**"
    "venv/**"
    "__pycache__/**"
    "target/**"
    "build/**"
    "*.iso"
)

# ------------------------------------------------------------------------------
# Layer 2: Application Configurations (~/.config)
# ------------------------------------------------------------------------------
EXCLUDE_CONFIG=(
    "*Cache*/**"
    "*cache*/**"
    "*GPUCache*/**"
    "*Code Cache*/**"
    "*CacheStorage*/**"
    "*blob_storage*/**"
    "mozilla/**"
    "BraveSoftware/**"
    "google-chrome/**"
    "*.lock"
    "*.sock"
    "dconf/user"
)

# Extra application configuration or data directories outside ~/.config:
EXTRA_CONFIG_DIRS=(
    # "$HOME/.var/app"                # Flatpak application user data
    # "$HOME/.local/share/keyrings"   # Keyrings and credentials
)

# ------------------------------------------------------------------------------
# Layer 3: Browser Session Vault
# ------------------------------------------------------------------------------
# In addition to DUMB_BROWSER_PRESET, track additional browser profile directories:
EXTRA_BROWSER_PATHS=(
    # "$HOME/.zen"
    # "$HOME/.librewolf"
    # "$HOME/.config/BraveSoftware/Brave-Browser/Default"
)

# ------------------------------------------------------------------------------
# Layer 4: Home Dotfiles & Custom Scripts
# List any dotfiles in $HOME you want tracked.
# ------------------------------------------------------------------------------
DOTFILES=(
    "$HOME/.bashrc"
    "$HOME/.gitconfig"
    "$HOME/.profile"
    "$HOME/.zshrc"
    # Examples of custom dotfiles users can easily add:
    # "$HOME/.tmux.conf"
    # "$HOME/.vimrc"
    # "$HOME/.p10k.zsh"
)

# Extra custom script directories to sync alongside ~/.local/bin:
EXTRA_SCRIPT_DIRS=(
    # "$HOME/bin"
    # "$HOME/.scripts"
)

# ------------------------------------------------------------------------------
# Layer 5: AI Agent Vault (Modern 2026 AI Workflows)
# Easily add any AI tool in format: "agent_name:path"
# ------------------------------------------------------------------------------
AI_AGENT_DIRS=(
    "gemini:$HOME/.gemini/antigravity-cli"
    "claude:$HOME/.claude"
    "codex:$HOME/.codex"
    "cursor:$HOME/.cursor"
    "openclaw:$HOME/.openclaw"
)

# Extra AI agent or local LLM directories:
EXTRA_AI_AGENT_DIRS=(
    # "ollama:$HOME/.ollama"
    # "continue:$HOME/.continue"
    # "open-webui:$HOME/.open-webui"
)

EXCLUDE_AI_AGENTS=(
    "*.log"
    "antigravity-oauth-token"
    ".credentials.json"
    "cache/**"
    "daemon/**"
    "downloads/**"
    "telemetry/**"
)

# ------------------------------------------------------------------------------
# Layer 6: Hardware Blueprint & Fonts
# ------------------------------------------------------------------------------
# Extra hardware tuning files or system services:
EXTRA_HARDWARE_PATHS=(
    # "/etc/thinkfan.conf"
    # "/etc/tlp.conf"
)

# Extra font directories to sync alongside JetBrainsMono:
EXTRA_FONT_DIRS=(
    # "$HOME/.fonts"
    # "$HOME/.local/share/fonts"
)
